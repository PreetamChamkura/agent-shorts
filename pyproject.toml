[project]
name = "clipper"
version = "0.1.0"
description = "Turns long-form video into 1080x1920 short-form clips with animated captions, tone-matched styling, and AI narrator commentary."
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "requests>=2.31",
    "opencv-python-headless>=4.9,<5",
]

[project.scripts]
clipper = "clipper.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0",
]
# Only the experiment analysis (clipper.stats, the notebook) needs these; the
# pipeline itself and the assignment/feature-flag code stay stdlib + pyyaml.
experiment = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.uv]
default-groups = ["dev", "experiment"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
